          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import androidx.lifecycle.lifecycleScope
          import androidx.media3.common.C
          import androidx.media3.common.MediaItem
          import androidx.media3.common.MediaMetadata
          import androidx.media3.common.PlaybackException
          import androidx.media3.common.Player
          import androidx.media3.common.TrackSelectionOverride
          import androidx.media3.common.util.UnstableApi
          import androidx.media3.session.MediaController
          import androidx.media3.session.SessionToken
          import androidx.media3.ui.AspectRatioFrameLayout
          import androidx.media3.ui.PlayerView
          import com.google.common.util.concurrent.ListenableFuture
          import com.google.common.util.concurrent.MoreExecutors
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import java.io.File

          @UnstableApi
          class MainActivity : AppCompatActivity() {

              private lateinit var db: AppDatabase
              private var controllerFuture: ListenableFuture<MediaController>? = null
              private var player: MediaController? = null

              private val allMedia = mutableListOf<LocalMedia>()
              private var displayedMedia = listOf<LocalMedia>()
              private var currentCategory = "HOME"
              private var currentSearch = ""

              private lateinit var mainContainer: LinearLayout
              private lateinit var contentArea: FrameLayout
              private lateinit var listContainer: LinearLayout
              private lateinit var videoOverlay: FrameLayout
              private lateinit var playerView: PlayerView
              private lateinit var miniPlayer: LinearLayout
              private lateinit var miniTitle: TextView
              private lateinit var miniSub: TextView
              private lateinit var miniPlayBtn: Button
              private lateinit var miniSeekBar: SeekBar
              private lateinit var timerBadge: TextView

              private var sleepTimer: CountDownTimer? = null
              private var equalizer: Equalizer? = null
              private var isVideoTouchLocked = false
              private var currentResizeMode = AspectRatioFrameLayout.RESIZE_MODE_FIT
              private var accentColor = Color.parseColor("#00E5FF")
              private val uiHandler = Handler(Looper.getMainLooper())

              private val progressRunnable = object : Runnable {
                  override fun run() {
                      player?.let { p ->
                          if (p.isPlaying) {
                              val dur = p.duration.coerceAtLeast(1L)
                              val pos = p.currentPosition.coerceAtLeast(0L)
                              miniSeekBar.max = (dur / 1000).toInt().coerceAtLeast(1)
                              miniSeekBar.progress = (pos / 1000).toInt()
                              p.currentMediaItem?.mediaId?.let { id ->
                                  if (id.isNotEmpty()) db.saveRecentAndPosition(id, pos)
                              }
                          }
                      }
                      uiHandler.postDelayed(this, 1000)
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  db = AppDatabase(this)
                  val prefs = getSharedPreferences("liteplay_prefs", Context.MODE_PRIVATE)
                  accentColor = Color.parseColor(prefs.getString("accent", "#00E5FF") ?: "#00E5FF")

                  buildFuturisticUi()
                  checkAndRequestPermissions()
              }

              override fun onStart() {
                  super.onStart()
                  val sessionToken = SessionToken(this, ComponentName(this, PlaybackService::class.java))
                  controllerFuture = MediaController.Builder(this, sessionToken).buildAsync()
                  controllerFuture?.addListener({
                      player = controllerFuture?.get()
                      setupPlayerListeners()
                      // Attach video surface when user returns to foreground without restarting playback
                      if (videoOverlay.visibility == View.VISIBLE) {
                          playerView.player = player
                      }
                      updateMiniPlayerState()
                  }, MoreExecutors.directExecutor())
                  uiHandler.post(progressRunnable)
              }

              override fun onStop() {
                  super.onStop()
                  // CRITICAL REQUIREMENT 8: Detach video surface when screen turns off or app goes to background
                  // so audio from video continues seamlessly in PlaybackService without video rendering drain!
                  playerView.player = null
                  uiHandler.removeCallbacks(progressRunnable)
                  controllerFuture?.let { MediaController.releaseFuture(it) }
              }

              override fun onDestroy() {
                  equalizer?.release()
                  sleepTimer?.cancel()
                  super.onDestroy()
              }

