                  android:roundIcon="@drawable/ic_launcher"
                  android:label="LitePlay Ultra Lite"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.LitePlay">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden"
                      android:launchMode="singleTop">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".PlaybackService"
                      android:exported="true"
                      android:foregroundServiceType="mediaPlayback">
                      <intent-filter>
                          <action android:name="androidx.media3.session.MediaSessionService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/liteplay/ultralite/AppDatabase.kt
          package com.liteplay.ultralite

          import android.content.Context
          import android.database.sqlite.SQLiteDatabase
          import android.database.sqlite.SQLiteOpenHelper
          import android.net.Uri

          data class LocalMedia(
              val id: Long,
              val uri: Uri,
              val title: String,
              val artist: String,
              val album: String,
              val folder: String,
              val duration: Long,
              val isVideo: Boolean,
              val mimeType: String,
              val dateAdded: Long
          )

          class AppDatabase(context: Context) : SQLiteOpenHelper(context, "liteplay_ultra.db", null, 1) {

              override fun onCreate(db: SQLiteDatabase) {
                  db.execSQL("CREATE TABLE favorites (uri TEXT PRIMARY KEY)")
                  db.execSQL("CREATE TABLE recent (uri TEXT PRIMARY KEY, played_at INTEGER, last_pos INTEGER)")
                  db.execSQL("CREATE TABLE playlists (id INTEGER PRIMARY KEY AUTOINCREMENT, name TEXT UNIQUE)")
                  db.execSQL("CREATE TABLE playlist_items (playlist_id INTEGER, uri TEXT, sort_order INTEGER, PRIMARY KEY(playlist_id, uri))")
              }

              override fun onUpgrade(db: SQLiteDatabase, oldVersion: Int, newVersion: Int) {}

              fun toggleFavorite(uri: String): Boolean {
                  val db = writableDatabase
                  val c = db.rawQuery("SELECT 1 FROM favorites WHERE uri = ?", arrayOf(uri))
                  val exists = c.moveToFirst()
                  c.close()
                  return if (exists) {
                      db.delete("favorites", "uri = ?", arrayOf(uri))
                      false
                  } else {
                      db.execSQL("INSERT OR IGNORE INTO favorites (uri) VALUES (?)", arrayOf(uri))
                      true
                  }
              }

              fun isFavorite(uri: String): Boolean {
                  val c = readableDatabase.rawQuery("SELECT 1 FROM favorites WHERE uri = ?", arrayOf(uri))
                  val res = c.moveToFirst()
                  c.close()
                  return res
              }

              fun getFavorites(): Set<String> {
                  val set = mutableSetOf<String>()
                  val c = readableDatabase.rawQuery("SELECT uri FROM favorites", null)
                  while (c.moveToNext()) set.add(c.getString(0))
                  c.close()
                  return set
              }

              fun saveRecentAndPosition(uri: String, pos: Long) {
                  writableDatabase.execSQL(
                      "INSERT OR REPLACE INTO recent (uri, played_at, last_pos) VALUES (?, ?, ?)",
                      arrayOf(uri, System.currentTimeMillis(), pos)
                  )
              }

              fun getSavedPosition(uri: String): Long {
                  val c = readableDatabase.rawQuery("SELECT last_pos FROM recent WHERE uri = ?", arrayOf(uri))
                  val pos = if (c.moveToFirst()) c.getLong(0) else 0L
                  c.close()
                  return pos
              }

              fun getRecentUris(): List<String> {
                  val list = mutableListOf<String>()
                  val c = readableDatabase.rawQuery("SELECT uri FROM recent ORDER BY played_at DESC LIMIT 50", null)
                  while (c.moveToNext()) list.add(c.getString(0))
                  c.close()
                  return list
              }

              fun createPlaylist(name: String) {
                  if (name.isBlank()) return
                  writableDatabase.execSQL("INSERT OR IGNORE INTO playlists (name) VALUES (?)", arrayOf(name.trim()))
              }

              fun renamePlaylist(id: Long, newName: String) {
                  if (newName.isBlank()) return
                  writableDatabase.execSQL("UPDATE playlists SET name = ? WHERE id = ?", arrayOf(newName.trim(), id))
              }

              fun deletePlaylist(id: Long) {
                  writableDatabase.delete("playlists", "id = ?", arrayOf(id.toString()))
                  writableDatabase.delete("playlist_items", "playlist_id = ?", arrayOf(id.toString()))
              }

              fun getPlaylists(): List<Pair<Long, String>> {
                  val list = mutableListOf<Pair<Long, String>>()
                  val c = readableDatabase.rawQuery("SELECT id, name FROM playlists ORDER BY name ASC", null)
                  while (c.moveToNext()) list.add(c.getLong(0) to c.getString(1))
                  c.close()
                  return list
              }

              fun addTrackToPlaylist(playlistId: Long, uri: String) {
                  writableDatabase.execSQL(
                      "INSERT OR REPLACE INTO playlist_items (playlist_id, uri, sort_order) VALUES (?, ?, ?)",
                      arrayOf(playlistId, uri, System.currentTimeMillis())
                  )
              }

              fun removeTrackFromPlaylist(playlistId: Long, uri: String) {
                  writableDatabase.delete("playlist_items", "playlist_id = ? AND uri = ?", arrayOf(playlistId.toString(), uri))
              }

              fun getPlaylistTracks(playlistId: Long): List<String> {
                  val list = mutableListOf<String>()
                  val c = readableDatabase.rawQuery(
                      "SELECT uri FROM playlist_items WHERE playlist_id = ? ORDER BY sort_order ASC",
                      arrayOf(playlistId.toString())
                  )
                  while (c.moveToNext()) list.add(c.getString(0))
                  c.close()
                  return list
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/liteplay/ultralite/PlaybackService.kt
          package com.liteplay.ultralite

          import android.app.PendingIntent
          import android.content.Intent
          import androidx.media3.common.AudioAttributes
          import androidx.media3.common.C
          import androidx.media3.common.util.UnstableApi
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.session.MediaSession
          import androidx.media3.session.MediaSessionService
          import io.github.anilbeesetti.nextlib.media3ext.ffdecoder.NextRenderersFactory

          @UnstableApi
          class PlaybackService : MediaSessionService() {
              private var mediaSession: MediaSession? = null

              override fun onCreate() {
                  super.onCreate()
                  val renderersFactory = NextRenderersFactory(this)
                      .setEnableDecoderFallback(true)

                  val audioAttributes = AudioAttributes.Builder()
                      .setUsage(C.USAGE_MEDIA)
                      .setContentType(C.AUDIO_CONTENT_TYPE_MUSIC)
                      .build()

                  val player = ExoPlayer.Builder(this, renderersFactory)
                      .setAudioAttributes(audioAttributes, true)
                      .setHandleAudioBecomingNoisy(true)
                      .setWakeMode(C.WAKE_MODE_LOCAL)
                      .build()

                  val intent = Intent(this, MainActivity::class.java)
                  val pendingIntent = PendingIntent.getActivity(
                      this, 0, intent,
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )

                  mediaSession = MediaSession.Builder(this, player)
                      .setSessionActivity(pendingIntent)
                      .build()
              }

              override fun onGetSession(controllerInfo: MediaSession.ControllerInfo): MediaSession? {
                  return mediaSession
              }

              override fun onTaskRemoved(rootIntent: Intent?) {
                  val player = mediaSession?.player
                  if (player == null || !player.playWhenReady || player.mediaItemCount == 0) {
                      stopSelf()
                  }
              }

              override fun onDestroy() {
                  mediaSession?.run {
                      player.release()
                      release()
                      mediaSession = null
                  }
                  super.onDestroy()
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/liteplay/ultralite/MainActivity.kt
          package com.liteplay.ultralite

          import android.Manifest
