                  }

                  val backAudioBtn = createPillButton("🔙 Background Audio") { closeVideoOverlay() }
                  val aspectBtn = createPillButton("📐 Fit/Zoom") {
                      currentResizeMode = when (currentResizeMode) {
                          AspectRatioFrameLayout.RESIZE_MODE_FIT -> AspectRatioFrameLayout.RESIZE_MODE_FILL
                          AspectRatioFrameLayout.RESIZE_MODE_FILL -> AspectRatioFrameLayout.RESIZE_MODE_ZOOM
                          else -> AspectRatioFrameLayout.RESIZE_MODE_FIT
                      }
                      playerView.resizeMode = currentResizeMode
                  }
                  val rotateBtn = createPillButton("🔄 Rotate") {
                      requestedOrientation = if (requestedOrientation == ActivityInfo.SCREEN_ORIENTATION_LANDSCAPE) {
                          ActivityInfo.SCREEN_ORIENTATION_PORTRAIT
                      } else {
                          ActivityInfo.SCREEN_ORIENTATION_LANDSCAPE
                      }
                  }
                  val speedBtn = createPillButton("⏩ Speed") { showSpeedDialog() }
                  val tracksBtn = createPillButton("💬 Audio/Subs") { showTrackSelectorDialog() }
                  val lockBtn = createPillButton("🔒 Lock") {
                      isVideoTouchLocked = !isVideoTouchLocked
                      playerView.useController = !isVideoTouchLocked
                      Toast.makeText(this, if (isVideoTouchLocked) "Touch Locked" else "Touch Unlocked", Toast.LENGTH_SHORT).show()
                  }

                  videoTopBar.addView(backAudioBtn)
                  videoTopBar.addView(aspectBtn)
                  videoTopBar.addView(rotateBtn)
                  videoTopBar.addView(speedBtn)
                  videoTopBar.addView(tracksBtn)
                  videoTopBar.addView(lockBtn)

                  videoOverlay.addView(playerView)
                  videoOverlay.addView(videoTopBar)

                  root.addView(mainContainer)
                  root.addView(videoOverlay)
                  setContentView(root)
              }

              private fun openVideoOverlay() {
                  videoOverlay.visibility = View.VISIBLE
                  playerView.player = player
              }

              private fun closeVideoOverlay() {
                  // Detach video surface so audio continues smoothly in background
                  playerView.player = null
                  videoOverlay.visibility = View.GONE
                  requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED
              }

              private fun setupPlayerListeners() {
                  player?.addListener(object : Player.Listener {
                      override fun onMediaItemTransition(mediaItem: MediaItem?, reason: Int) {
                          updateMiniPlayerState()
                      }

                      override fun onIsPlayingChanged(isPlaying: Boolean) {
                          updateMiniPlayerState()
                      }

                      override fun onPlayerError(error: PlaybackException) {
                          Toast.makeText(
                              this@MainActivity,
                              "Playback Error (${error.errorCodeName}): Skipping corrupted/unsupported file",
                              Toast.LENGTH_LONG
                          ).show()
                      }
                  })
              }

              private fun updateMiniPlayerState() {
                  val p = player ?: return
                  val item = p.currentMediaItem
                  miniTitle.text = item?.mediaMetadata?.title ?: "LitePlay Ready"
                  miniSub.text = item?.mediaMetadata?.artist ?: "Screen-Off Audio Engine Active"
                  miniPlayBtn.text = if (p.isPlaying) "⏸" else "▶️"
              }

              private fun checkAndRequestPermissions() {
                  val perms = mutableListOf<String>()
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      perms.add(Manifest.permission.READ_MEDIA_AUDIO)
                      perms.add(Manifest.permission.READ_MEDIA_VIDEO)
                      perms.add(Manifest.permission.POST_NOTIFICATIONS)
                  } else {
                      perms.add(Manifest.permission.READ_EXTERNAL_STORAGE)
                  }
                  val missing = perms.filter {
                      ContextCompat.checkSelfPermission(this, it) != PackageManager.PERMISSION_GRANTED
                  }
                  if (missing.isNotEmpty()) {
                      ActivityCompat.requestPermissions(this, missing.toTypedArray(), 101)
                  } else {
                      scanOfflineLibrary()
                  }
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  scanOfflineLibrary()
              }

              private fun scanOfflineLibrary() {
                  lifecycleScope.launch(Dispatchers.IO) {
                      val discovered = mutableListOf<LocalMedia>()

                      // Query Audio
                      val audioProjection = arrayOf(
                          MediaStore.Audio.Media._ID,
                          MediaStore.Audio.Media.TITLE,
                          MediaStore.Audio.Media.ARTIST,
                          MediaStore.Audio.Media.ALBUM,
                          MediaStore.Audio.Media.DURATION,
                          MediaStore.Audio.Media.DATA,
                          MediaStore.Audio.Media.MIME_TYPE,
                          MediaStore.Audio.Media.DATE_ADDED
                      )
                      contentResolver.query(
                          MediaStore.Audio.Media.EXTERNAL_CONTENT_URI,
                          audioProjection, null, null, "${MediaStore.Audio.Media.TITLE} ASC"
                      )?.use { c ->
                          val idCol = c.getColumnIndexOrThrow(MediaStore.Audio.Media._ID)
                          val titleCol = c.getColumnIndexOrThrow(MediaStore.Audio.Media.TITLE)
                          val artistCol = c.getColumnIndexOrThrow(MediaStore.Audio.Media.ARTIST)
                          val albumCol = c.getColumnIndexOrThrow(MediaStore.Audio.Media.ALBUM)
                          val durCol = c.getColumnIndexOrThrow(MediaStore.Audio.Media.DURATION)
                          val dataCol = c.getColumnIndexOrThrow(MediaStore.Audio.Media.DATA)
                          val mimeCol = c.getColumnIndexOrThrow(MediaStore.Audio.Media.MIME_TYPE)
                          val dateCol = c.getColumnIndexOrThrow(MediaStore.Audio.Media.DATE_ADDED)

                          while (c.moveToNext()) {
                              val id = c.getLong(idCol)
                              val path = c.getString(dataCol) ?: ""
                              val folder = File(path).parentFile?.name ?: "Music"
                              val uri = ContentUris.withAppendedId(MediaStore.Audio.Media.EXTERNAL_CONTENT_URI, id)
                              discovered.add(
                                  LocalMedia(
                                      id = id,
                                      uri = uri,
                                      title = c.getString(titleCol) ?: "Unknown Audio",
                                      artist = c.getString(artistCol) ?: "Unknown Artist",
                                      album = c.getString(albumCol) ?: "Unknown Album",
                                      folder = folder,
                                      duration = c.getLong(durCol),
                                      isVideo = false,
                                      mimeType = c.getString(mimeCol) ?: "audio/*",
                                      dateAdded = c.getLong(dateCol)
                                  )
                              )
                          }
                      }

                      // Query Video
                      val videoProjection = arrayOf(
                          MediaStore.Video.Media._ID,
                          MediaStore.Video.Media.TITLE,
                          MediaStore.Video.Media.ARTIST,
                          MediaStore.Video.Media.ALBUM,
                          MediaStore.Video.Media.DURATION,
                          MediaStore.Video.Media.DATA,
                          MediaStore.Video.Media.MIME_TYPE,
                          MediaStore.Video.Media.DATE_ADDED
                      )
                      contentResolver.query(
                          MediaStore.Video.Media.EXTERNAL_CONTENT_URI,
                          videoProjection, null, null, "${MediaStore.Video.Media.TITLE} ASC"
                      )?.use { c ->
                          val idCol = c.getColumnIndexOrThrow(MediaStore.Video.Media._ID)
                          val titleCol = c.getColumnIndexOrThrow(MediaStore.Video.Media.TITLE)
                          val artistCol = c.getColumnIndexOrThrow(MediaStore.Video.Media.ARTIST)
                          val albumCol = c.getColumnIndexOrThrow(MediaStore.Video.Media.ALBUM)
                          val durCol = c.getColumnIndexOrThrow(MediaStore.Video.Media.DURATION)
                          val dataCol = c.getColumnIndexOrThrow(MediaStore.Video.Media.DATA)
                          val mimeCol = c.getColumnIndexOrThrow(MediaStore.Video.Media.MIME_TYPE)
                          val dateCol = c.getColumnIndexOrThrow(MediaStore.Video.Media.DATE_ADDED)

                          while (c.moveToNext()) {
                              val id = c.getLong(idCol)
                              val path = c.getString(dataCol) ?: ""
                              val folder = File(path).parentFile?.name ?: "Videos"
                              val uri = ContentUris.withAppendedId(MediaStore.Video.Media.EXTERNAL_CONTENT_URI, id)
                              discovered.add(
                                  LocalMedia(
                                      id = id,
                                      uri = uri,
                                      title = c.getString(titleCol) ?: "Unknown Video",
                                      artist = c.getString(artistCol) ?: "Local Video",
                                      album = c.getString(albumCol) ?: folder,
                                      folder = folder,
                                      duration = c.getLong(durCol),
                                      isVideo = true,
                                      mimeType = c.getString(mimeCol) ?: "video/*",
                                      dateAdded = c.getLong(dateCol)
                                  )
                              )
                          }
                      }

                      withContext(Dispatchers.Main) {
                          allMedia.clear()
                          allMedia.addAll(discovered)
                          refreshDisplayedList()
                      }
                  }
              }

              private fun refreshDisplayedList() {
                  listContainer.removeAllViews()

                  // Quick Action Bar
                  val actionBar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setPadding(0, 4, 0, 16)
                  }
                  val playAllBtn = createPillButton("▶️ Play All") {
                      if (displayedMedia.isNotEmpty()) playMediaList(displayedMedia, 0, false)
                  }
                  val shuffleAllBtn = createPillButton("🔀 Shuffle All") {
                      if (displayedMedia.isNotEmpty()) playMediaList(displayedMedia.shuffled(), 0, false)
                  }
                  val rescanBtn = createPillButton("🔄 Rescan") { scanOfflineLibrary() }
                  actionBar.addView(playAllBtn)
                  actionBar.addView(shuffleAllBtn)
                  actionBar.addView(rescanBtn)
                  listContainer.addView(actionBar)

                  when (currentCategory) {
                      "SETTINGS" -> {
                          renderSettingsView()
                          return
                      }
                      "CODECS" -> {
                          renderCodecCompatibilityReport()
                          return
                      }
                      "PLAYLISTS" -> {
                          renderPlaylistsView()
                          return
                      }
                  }

                  val favs = db.getFavorites()
                  val recents = db.getRecentUris()

                  val baseList = when (currentCategory) {
                      "SONGS" -> allMedia.filter { !it.isVideo }
                      "VIDEOS" -> allMedia.filter { it.isVideo }
                      "FAVORITES" -> allMedia.filter { favs.contains(it.uri.toString()) }
                      "RECENT" -> recents.mapNotNull { u -> allMedia.find { it.uri.toString() == u } }
                      "ALBUMS" -> allMedia.sortedBy { it.album }
                      "ARTISTS" -> allMedia.sortedBy { it.artist }
                      "FOLDERS" -> allMedia.sortedBy { it.folder }
                      else -> allMedia
                  }

                  displayedMedia = if (currentSearch.isBlank()) {
                      baseList
                  } else {
                      val q = currentSearch.lowercase()
                      baseList.filter {
                          it.title.lowercase().contains(q) ||
                          it.artist.lowercase().contains(q) ||
                          it.album.lowercase().contains(q) ||
                          it.folder.lowercase().contains(q)
                      }
                  }

                  if (displayedMedia.isEmpty()) {
                      val emptyView = TextView(this).apply {
                          text = "📭 कोई मीडिया फाइल नहीं मिली।\nफोन में गाने या वीडियो डालें और 'Rescan' दबाएं।"
                          setTextColor(Color.parseColor("#778899"))
                          textSize = 15f
                          gravity = Gravity.CENTER
                          setPadding(32, 80, 32, 80)
                      }
                      listContainer.addView(emptyView)
                      return
                  }

                  displayedMedia.forEachIndexed { index, item ->
                      listContainer.addView(createMediaCard(item, index))
                  }
              }

              private fun createMediaCard(item: LocalMedia, index: Int): View {
                  val card = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(24, 20, 24, 20)
                      background = roundedBg("#0B1119", "#162436", 22f)
                      val lp = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                      lp.setMargins(0, 0, 0, 14)
                      layoutParams = lp
                      setOnClickListener {
                          playMediaList(displayedMedia, index, item.isVideo)
                      }
                  }

                  val iconBadge = TextView(this).apply {
                      text = if (item.isVideo) "🎬" else "🎵"
                      textSize = 22f
                      setPadding(0, 0, 24, 0)
                  }

                  val infoCol = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                  }

                  val titleTv = TextView(this).apply {
                      text = item.title
                      setTextColor(Color.WHITE)
                      textSize = 15f
                      setTypeface(typeface, Typeface.BOLD)
                      maxLines = 1
                      ellipsize = TextUtils.TruncateAt.END
                  }

                  val metaTv = TextView(this).apply {
                      text = "${item.artist} • ${item.folder} • ${formatMs(item.duration)}"
                      setTextColor(Color.parseColor("#7E99B5"))
                      textSize = 12f
                      maxLines = 1
                      ellipsize = TextUtils.TruncateAt.END
                  }

                  infoCol.addView(titleTv)
                  infoCol.addView(metaTv)

                  val isFav = db.isFavorite(item.uri.toString())
                  val favBtn = createPillButton(if (isFav) "❤️" else "🤍") {
                      db.toggleFavorite(item.uri.toString())
                      refreshDisplayedList()
                  }

                  val moreBtn = createPillButton("⋮") {
                      showFileActionsDialog(item, index)
                  }

                  card.addView(iconBadge)
                  card.addView(infoCol)
                  card.addView(favBtn)
                  card.addView(moreBtn)
                  return card
              }

              private fun playMediaList(list: List<LocalMedia>, startIndex: Int, openVideoUi: Boolean) {
                  val p = player ?: return
                  val mediaItems = list.map { media ->
                      MediaItem.Builder()
                          .setMediaId(media.uri.toString())
                          .setUri(media.uri)
                          .setMediaMetadata(
                              MediaMetadata.Builder()
                                  .setTitle(media.title)
                                  .setArtist(media.artist)
                                  .setAlbumTitle(media.album)
                                  .build()
                          )
                          .build()
                  }
                  p.setMediaItems(mediaItems, startIndex, 0L)
                  p.prepare()

                  // Restore saved position if enabled
                  val prefs = getSharedPreferences("liteplay_prefs", Context.MODE_PRIVATE)
                  if (prefs.getBoolean("remember_pos", true)) {
                      val savedPos = db.getSavedPosition(list[startIndex].uri.toString())
                      if (savedPos > 3000L && savedPos < list[startIndex].duration - 5000L) {
                          p.seekTo(savedPos)
                      }
                  }

                  p.play()
                  if (openVideoUi) {
                      openVideoOverlay()
                  }
              }

              private fun showFileActionsDialog(item: LocalMedia, index: Int) {
                  val options = arrayOf(
                      "▶️ Play Now",
                      "🎧 Play Video as Background Audio Only",
                      "⏭ Play Next in Queue",
                      "➕ Add to Queue",
                      "❤️ Toggle Favorite",
                      "📜 Add to Playlist",
                      "ℹ️ View Codec & File Details",
                      "🗑️ Delete from Device"
                  )
                  AlertDialog.Builder(this)
                      .setTitle(item.title)
                      .setItems(options) { _, which ->
                          when (which) {
                              0 -> playMediaList(displayedMedia, index, item.isVideo)
                              1 -> playMediaList(displayedMedia, index, false)
                              2 -> {
                                  val mi = MediaItem.Builder().setMediaId(item.uri.toString()).setUri(item.uri)
                                      .setMediaMetadata(MediaMetadata.Builder().setTitle(item.title).setArtist(item.artist).build()).build()
                                  val nextIdx = ((player?.currentMediaItemIndex ?: 0) + 1).coerceAtMost(player?.mediaItemCount ?: 0)
                                  player?.addMediaItem(nextIdx, mi)
                              }
                              3 -> {
                                  val mi = MediaItem.Builder().setMediaId(item.uri.toString()).setUri(item.uri)
                                      .setMediaMetadata(MediaMetadata.Builder().setTitle(item.title).setArtist(item.artist).build()).build()
                                  player?.addMediaItem(mi)
                              }
                              4 -> {
                                  db.toggleFavorite(item.uri.toString())
                                  refreshDisplayedList()
                              }
                              5 -> showAddToPlaylistDialog(item)
                              6 -> {
                                  AlertDialog.Builder(this)
                                      .setTitle("Media Details")
                                      .setMessage("Title: ${item.title}\nArtist: ${item.artist}\nAlbum: ${item.album}\nFolder: ${item.folder}\nMIME: ${item.mimeType}\nDuration: ${formatMs(item.duration)}\nURI: ${item.uri}")
                                      .setPositiveButton("OK", null)
                                      .show()
                              }
                              7 -> confirmDeleteMediaFile(item)
                          }
                      }
                      .show()
              }

              private fun confirmDeleteMediaFile(item: LocalMedia) {
                  AlertDialog.Builder(this)
                      .setTitle("Delete File from Device?")
                      .setMessage("क्या आप वाकई '${item.title}' को अपने फोन से हमेशा के लिए डिलीट करना चाहते हैं?")
                      .setPositiveButton("Delete") { _, _ ->
                          try {
                              val rows = contentResolver.delete(item.uri, null, null)
                              if (rows > 0) {
                                  Toast.makeText(this, "फाइल डिलीट कर दी गई", Toast.LENGTH_SHORT).show()
                                  scanOfflineLibrary()
                              } else {
                                  Toast.makeText(this, "Android Scoped Storage ने डिलीट रोका", Toast.LENGTH_LONG).show()
                              }
                          } catch (e: Exception) {
                              Toast.makeText(this, "डिलीट करने में त्रुटि: ${e.localizedMessage}", Toast.LENGTH_LONG).show()
                          }
                      }
                      .setNegativeButton("Cancel", null)
                      .show()
              }

              private fun renderPlaylistsView() {
                  val createBtn = createPillButton("➕ Create New Playlist") {
                      val input = EditText(this).apply { hint = "Playlist Name" }
                      AlertDialog.Builder(this)
                          .setTitle("New Playlist")
                          .setView(input)
                          .setPositiveButton("Create") { _, _ ->
                              db.createPlaylist(input.text.toString())
                              refreshDisplayedList()
                          }
                          .setNegativeButton("Cancel", null)
                          .show()
                  }
                  listContainer.addView(createBtn)

                  val playlists = db.getPlaylists()
                  for ((plId, plName) in playlists) {
                      val trackUris = db.getPlaylistTracks(plId)
                      val tracks = trackUris.mapNotNull { u -> allMedia.find { it.uri.toString() == u } }

                      val row = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          gravity = Gravity.CENTER_VERTICAL
                          setPadding(24, 24, 24, 24)
                          background = roundedBg("#0C141E", "#1F334D", 20f)
                          val lp = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                          lp.setMargins(0, 12, 0, 12)
                          layoutParams = lp
                          setOnClickListener {
                              if (tracks.isNotEmpty()) playMediaList(tracks, 0, false)
                              else Toast.makeText(this@MainActivity, "यह प्लेलिस्ट खाली है", Toast.LENGTH_SHORT).show()
                          }
                      }

                      val tv = TextView(this).apply {
                          text = "📜 $plName (${tracks.size} tracks)"
                          setTextColor(Color.WHITE)
                          textSize = 16f
                          layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                      }

                      val delBtn = createPillButton("🗑️") {
                          db.deletePlaylist(plId)
                          refreshDisplayedList()
                      }

                      row.addView(tv)
                      row.addView(delBtn)
                      listContainer.addView(row)
                  }
              }

              private fun showAddToPlaylistDialog(item: LocalMedia) {
                  val playlists = db.getPlaylists()
                  if (playlists.isEmpty()) {
                      db.createPlaylist("My Top Tracks")
                  }
                  val updated = db.getPlaylists()
                  val names = updated.map { it.second }.toTypedArray()
                  AlertDialog.Builder(this)
                      .setTitle("Add to Playlist")
                      .setItems(names) { _, which ->
                          db.addTrackToPlaylist(updated[which].first, item.uri.toString())
                          Toast.makeText(this, "Added to ${names[which]}", Toast.LENGTH_SHORT).show()
                      }
                      .show()
              }

              private fun showFullNowPlayingDialog() {
                  val p = player ?: return
                  val options = arrayOf(
                      "⏯ Play / Pause",
                      "🔀 Toggle Shuffle (${if (p.shuffleModeEnabled) "ON" else "OFF"})",
                      "🔁 Cycle Repeat Mode",
                      "⏩ Playback Speed (${p.playbackParameters.speed}x)",
                      "📺 Open Video Screen (if Video)",
                      "🎛️ Open Equalizer",
                      "🌙 Set Sleep Timer"
                  )
                  AlertDialog.Builder(this)
                      .setTitle(p.currentMediaItem?.mediaMetadata?.title ?: "Now Playing")
                      .setItems(options) { _, which ->
                          when (which) {
                              0 -> if (p.isPlaying) p.pause() else p.play()
                              1 -> p.shuffleModeEnabled = !p.shuffleModeEnabled
                              2 -> {
                                  p.repeatMode = when (p.repeatMode) {
                                      Player.REPEAT_MODE_OFF -> Player.REPEAT_MODE_ALL
                                      Player.REPEAT_MODE_ALL -> Player.REPEAT_MODE_ONE
                                      else -> Player.REPEAT_MODE_OFF
                                  }
                              }
                              3 -> showSpeedDialog()
                              4 -> openVideoOverlay()
                              5 -> showEqualizerDialog()
                              6 -> showSleepTimerDialog()
                          }
                      }
                      .show()
              }

              private fun showSpeedDialog() {
                  val speeds = arrayOf("0.5x", "0.75x", "1.0x (Normal)", "1.25x", "1.5x", "2.0x")
                  val values = floatArrayOf(0.5f, 0.75f, 1.0f, 1.25f, 1.5f, 2.0f)
                  AlertDialog.Builder(this)
                      .setTitle("Playback Speed")
                      .setItems(speeds) { _, which ->
                          player?.setPlaybackSpeed(values[which])
                      }
                      .show()
              }

              private fun showTrackSelectorDialog() {
                  val p = player ?: return
                  val options = arrayOf("Disable Subtitles", "Enable Default Subtitles")
                  AlertDialog.Builder(this)
                      .setTitle("Audio & Subtitle Tracks")
                      .setItems(options) { _, which ->
                          val params = p.trackSelectionParameters.buildUpon()
                              .setTrackTypeDisabled(C.TRACK_TYPE_TEXT, which == 0)
                              .build()
                          p.trackSelectionParameters = params
                      }
                      .show()
              }

              private fun showSleepTimerDialog() {
                  val items = arrayOf("5 Minutes", "10 Minutes", "15 Minutes", "30 Minutes", "45 Minutes", "60 Minutes", "❌ Cancel Timer")
                  val mins = intArrayOf(5, 10, 15, 30, 45, 60, 0)
                  AlertDialog.Builder(this)
                      .setTitle("🌙 Sleep Timer")
                      .setItems(items) { _, which ->
                          sleepTimer?.cancel()
                          val m = mins[which]
                          if (m == 0) {
                              timerBadge.text = ""
                              Toast.makeText(this, "Sleep Timer Cancelled", Toast.LENGTH_SHORT).show()
                          } else {
                              sleepTimer = object : CountDownTimer(m * 60 * 1000L, 1000L) {
                                  override fun onTick(left: Long) {
                                      timerBadge.text = "⏳ ${formatMs(left)}"
                                  }
                                  override fun onFinish() {
                                      timerBadge.text = ""
                                      player?.pause()
                                  }
                              }.start()
                          }
                      }
                      .show()
              }

              private fun showEqualizerDialog() {
                  try {
                      if (equalizer == null) {
                          equalizer = Equalizer(0, 0).apply { enabled = true }
                      }
                      val eq = equalizer ?: return
                      val presets = (0 until eq.numberOfPresets).map { eq.getPresetName(it.toShort()) }.toTypedArray()
                      AlertDialog.Builder(this)
                          .setTitle("🎛️ Hardware Equalizer Presets")
                          .setItems(presets) { _, which ->
                              eq.usePreset(which.toShort())
                              Toast.makeText(this, "Preset: ${presets[which]}", Toast.LENGTH_SHORT).show()
                          }
                          .show()
                  } catch (e: Exception) {
                      Toast.makeText(this, "Hardware Equalizer starts once audio is actively playing", Toast.LENGTH_LONG).show()
                  }
              }

