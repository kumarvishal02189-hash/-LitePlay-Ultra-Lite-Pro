              private fun renderCodecCompatibilityReport() {
                  val report = TextView(this).apply {
                      text = """
                          🛡️ HONEST CODEC & FORMAT COMPATIBILITY REPORT
                          
                          1. NATIVE & FFMPEG ENGINE SUPPORTED AUDIO:
                          • MP3, AAC, M4A, FLAC, WAV, PCM, OGG, Opus, Vorbis
                          • AC3, E-AC3, ALAC, WMA, AMR, APE (via NextLib FFmpeg software decoder)
                          
                          2. NATIVE & FFMPEG ENGINE SUPPORTED VIDEO:
                          • Containers: MP4, MKV, WebM, MOV, AVI, 3GP, TS, M2TS, FLV
                          • Video Codecs: H.264/AVC, H.265/HEVC, VP8, VP9, AV1, MPEG-4
                          
                          3. SCREEN-OFF PLAYBACK ARCHITECTURE:
                          • Foreground MediaSessionService with WAKE_MODE_LOCAL.
                          • Detaches SurfaceView onStop() so video audio never pauses when locking screen.
                          
                          4. HARDWARE LIMITATIONS:
                          • 4K/8K 10-bit HEVC/AV1 playback speed depends on device SoC hardware decoder.
                      """.trimIndent()
                      setTextColor(Color.parseColor("#00E5FF"))
                      textSize = 14f
                      setPadding(24, 24, 24, 24)
                      background = roundedBg("#09131C", "#00E5FF", 20f)
                  }
                  listContainer.addView(report)
              }

              private fun createPillButton(label: String, onClick: () -> Unit): Button {
                  return Button(this).apply {
                      text = label
                      isAllCaps = false
                      textSize = 12f
                      setTextColor(Color.WHITE)
                      background = roundedBg("#101A26", "#00E5FF", 40f)
                      setPadding(28, 10, 28, 10)
                      val lp = LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                      lp.setMargins(8, 4, 8, 4)
                      layoutParams = lp
                      setOnClickListener { onClick() }
                  }
              }

              private fun roundedBg(fillHex: String, strokeHex: String, radius: Float): GradientDrawable {
                  return GradientDrawable().apply {
                      setColor(Color.parseColor(fillHex))
                      setStroke(2, Color.parseColor(strokeHex))
                      cornerRadius = radius
                  }
              }

              private fun formatMs(ms: Long): String {
                  val totalSec = (ms / 1000).coerceAtLeast(0)
                  val m = totalSec / 60
                  val s = totalSec % 60
                  return String.format("%02d:%02d", m, s)
              }
          }
